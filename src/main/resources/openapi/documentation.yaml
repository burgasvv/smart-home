        name:
          type: "string"
          nullable: true
        description:
          type: "string"
          nullable: true
    IdentityDependency:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        authority:
          type: "string"
          enum:
            - "ADMIN"
