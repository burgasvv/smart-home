security:
  - OriginHeader: []

components:
  securitySchemes:
    OriginHeader:
      type: apiKey
      in: header
      name: Origin
      description: "Нажмите Authorize и вставьте: http://localhost:8000"
  schemas:
    ExceptionResponse:
      type: "object"
      properties:
        status:
          type: "string"
        code:
          type: "integer"
          format: "int32"
        message:
          type: "string"
          nullable: true
      required:
        - "status"
        - "code"
    AuthData:
      type: "object"
      properties:
        email:
          type: "string"
        password:
          type: "string"
      required:
        - "email"
        - "password"
    Uuid:
      type: "object"
      properties:
        mostSignificantBits:
          type: "integer"
          format: "int64"
        leastSignificantBits:
          type: "integer"
          format: "int64"
      required:
        - "mostSignificantBits"
        - "leastSignificantBits"
    ImageDependency:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: "string"
          nullable: true
        contentType:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "contentType"
        - "createdAt"
    CategoryDependency:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: "string"
        description:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "name"
        - "description"
        - "createdAt"
    BrandDependency:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: "string"
        description:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "name"
        - "description"
        - "createdAt"
    DeviceDependency:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        category:
          nullable: true
          $ref: "#/components/schemas/CategoryDependency"
        brand:
          nullable: true
          $ref: "#/components/schemas/BrandDependency"
        model:
          type: "string"
        specifications:
          type: "string"
        inProgress:
          type: "boolean"
        ipAddress:
          type: "string"
          nullable: true
        port:
          type: "integer"
          format: "int32"
          nullable: true
        token:
          type: "string"
          nullable: true
        image:
          nullable: true
          $ref: "#/components/schemas/ImageDependency"
        createdAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "model"
        - "specifications"
        - "inProgress"
        - "createdAt"
    IdentityResponse:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        authority:
          type: "string"
          enum:
            - "ADMIN"
            - "USER"
        email:
          type: "string"
        status:
          type: "boolean"
        firstname:
          type: "string"
        lastname:
          type: "string"
        patronymic:
          type: "string"
        image:
          nullable: true
          $ref: "#/components/schemas/ImageDependency"
        createdAt:
          type: "string"
          format: "date-time"
        devices:
          type: "array"
          items:
            $ref: "#/components/schemas/DeviceDependency"
      required:
        - "id"
        - "authority"
        - "email"
        - "status"
        - "firstname"
        - "lastname"
        - "patronymic"
        - "createdAt"
        - "devices"
    IdentityRequest:
      type: "object"
      properties:
        id:
          nullable: true
          $ref: "#/components/schemas/Uuid"
        authority:
          type: "string"
          nullable: true
          enum:
            - "ADMIN"
            - "USER"
        email:
          type: "string"
          nullable: true
        password:
          type: "string"
          nullable: true
        status:
          type: "boolean"
          nullable: true
        firstname:
          type: "string"
          nullable: true
        lastname:
          type: "string"
          nullable: true
        patronymic:
          type: "string"
          nullable: true
    CategoryResponse:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: "string"
        description:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        devices:
