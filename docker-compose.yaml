
services:

  postgres:
    image: postgres:latest
    container_name: smart-home-postgres
    environment:
      POSTGRES_DB: smart-home-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5000:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: smart-home-redis
    ports:
      - "6000:6379"
    volumes:
      - redis-data:/var/lib/redis/data

  smart-home:
    container_name: smart-home
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_URL: 'jdbc:postgresql://postgres:5432/smart-home-db'
      REDIS_HOST: redis
      REDIS_PORT: 6379

volumes:
  postgres-data:
  redis-data:
